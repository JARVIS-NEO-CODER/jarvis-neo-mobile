name: jarvis_neo_mobile
description: JARVIS NEO Mobile cross-platform companion for Android and iOS.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  web_socket_channel: ^3.0.1
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.0
  intl: ^0.19.0
  uuid: ^4.5.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  camera: ^0.11.0+2
  sensors_plus: ^6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
