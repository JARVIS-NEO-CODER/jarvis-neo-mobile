name: Build JARVIS NEO Mobile
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter create . --project-name jarvis_neo_mobile --platforms=android --org com.jarvisneo
      - name: Configure Android build and runtime permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          s = s.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
          s = s.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 36')
          p.write_text(s)
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          permissions = '''\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'''
          if marker in s and 'RECORD_AUDIO' not in s:
              s = s.replace(marker, marker + permissions)
          elif marker in s and 'INTERNET' not in s:
              s = s.replace(marker, marker + '    <uses-permission android:name="android.permission.INTERNET" />\n')
          app_marker = '<application'
          if app_marker in s and 'android:usesCleartextTraffic=' not in s:
              s = s.replace(app_marker, '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-neo-mobile-android
          path: build/app/outputs/flutter-apk/app-release.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - run: flutter create . --project-name jarvis_neo_mobile --platforms=ios --org com.jarvisneo
      - name: Configure iOS deployment target and privacy descriptions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          podfile = Path('ios/Podfile')
          s = podfile.read_text()
          s = s.replace("# platform :ios, '12.0'", "platform :ios, '13.0'")
          if "platform :ios" not in s:
              s = "platform :ios, '13.0'\n" + s
          podfile.write_text(s)
          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          s = project.read_text()
          s = s.replace('IPHONEOS_DEPLOYMENT_TARGET = 12.0;', 'IPHONEOS_DEPLOYMENT_TARGET = 13.0;')
          project.write_text(s)
          info = Path('ios/Runner/Info.plist')
          s = info.read_text()
          entries = '''\n\t<key>NSMicrophoneUsageDescription</key>\n\t<string>JARVIS NEO utilise le microphone pour les commandes vocales.</string>\n\t<key>NSSpeechRecognitionUsageDescription</key>\n\t<string>JARVIS NEO utilise la reconnaissance vocale pour comprendre les commandes.</string>\n\t<key>NSCameraUsageDescription</key>\n\t<string>JARVIS NEO utilise la caméra lorsque cette fonction est autorisée.</string>\n\t<key>NSLocationWhenInUseUsageDescription</key>\n\t<string>JARVIS NEO utilise la localisation pour les fonctions autorisées et les routines.</string>\n\t<key>NSBluetoothAlwaysUsageDescription</key>\n\t<string>JARVIS NEO utilise Bluetooth pour les appareils autorisés.</string>\n\t<key>NSLocalNetworkUsageDescription</key>\n\t<string>JARVIS NEO recherche les ordinateurs JARVIS NEO présents sur le réseau local.</string>\n'''
          if 'NSMicrophoneUsageDescription' not in s:
              s = s.replace('</dict>', entries + '</dict>')
          elif 'NSLocalNetworkUsageDescription' not in s:
              s = s.replace('</dict>', '\n\t<key>NSLocalNetworkUsageDescription</key>\n\t<string>JARVIS NEO recherche les ordinateurs JARVIS NEO présents sur le réseau local.</string>\n</dict>')
          info.write_text(s)
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS app
        run: mkdir -p artifacts && cd build/ios/iphoneos && zip -r ../../../artifacts/jarvis-neo-mobile-ios-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-neo-mobile-ios
          path: artifacts/jarvis-neo-mobile-ios-unsigned.zip
  pc-bridge-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mobile
        uses: actions/checkout@v4
      - name: Checkout current PC bridge
        uses: actions/checkout@v4
        with:
          repository: JARVIS-NEO-CODER/jarvis.neo
          path: pc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PC bridge test runtime
        run: python -m pip install 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1'
      - name: Start real PC bridge implementation
        run: |
          cd pc
          JARVIS_E2E_PORT=8890 JARVIS_E2E_DEVICES_FILE=/tmp/jarvis-e2e-devices.json python -m uvicorn tests.e2e_mobile_server:app --host 127.0.0.1 --port 8890 --log-level warning > /tmp/jarvis-pc-e2e.log 2>&1 &
          echo $! > /tmp/jarvis-pc-e2e.pid
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8890/api/system >/dev/null 2>&1 && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:8890/docs >/dev/null
      - run: flutter pub get
      - name: Run Flutter ↔ PC E2E
        run: flutter test test/pc_bridge_e2e_test.dart -r expanded
      - name: Dump PC bridge logs on failure
        if: failure()
        run: cat /tmp/jarvis-pc-e2e.log || true
      - name: E2E result
        if: always()
        run: |
          echo '============================================'
          echo ' J.A.R.V.I.S. NEO MOBILE ↔ PC E2E'
          echo '============================================'
          echo 'REAL PC BRIDGE + REAL FLUTTER CLIENT'
          echo 'PAIRING / AUTH / PING / STATUS / SYNC / ACTION / RECONNECT'
          echo '============================================'
